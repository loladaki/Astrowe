<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#060607" />
  <title>Astrowe — is it worth going out tonight?</title>
  <meta name="description" content="Of the next few nights, which is worth it? Astrowe gives a nightly astronomy observing score: the best window of hours, what limits you, and what you can observe." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://astrowe.onrender.com/" />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Partilha (Open Graph / Twitter). Se mudares de domínio, atualiza estes URLs. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Astrowe" />
  <meta property="og:locale" content="en_GB" />
  <meta property="og:title" content="Astrowe — is it worth going out tonight?" />
  <meta property="og:description" content="A nightly astronomy observing score: the best window of hours, what limits you, and what you can observe." />
  <meta property="og:url" content="https://astrowe.onrender.com/" />
  <meta property="og:image" content="https://astrowe.onrender.com/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Astrowe — is it worth going out tonight?" />
  <meta name="twitter:description" content="A nightly astronomy observing score: the best window, what limits you, and what you can observe." />
  <meta name="twitter:image" content="https://astrowe.onrender.com/og.png" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/style.css?v=16" />
</head>
<body>
  <div class="shell">

    <header class="site-header">
      <div class="header-bar">
        <h1 class="site-name">Astrowe</h1>

        <form id="search-form" class="header-search" autocomplete="off">
          <div class="search-wrap">
            <input id="place" type="text" placeholder="Where will you observe?"
                   role="combobox" aria-expanded="false" aria-autocomplete="list"
                   aria-controls="suggestions" />
            <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
          </div>
          <button type="button" id="geo-btn" class="btn-icon" title="Use my location">📍</button>
          <button type="button" id="map-btn" class="btn-icon" title="Pick on the map">🗺</button>
          <button type="submit" class="btn-primary">See nights</button>
        </form>

        <div class="menu-wrap">
          <button type="button" id="menu-btn" class="menu-toggle" aria-haspopup="true"
                  aria-expanded="false" aria-controls="menu-panel">☰ Menu</button>
          <nav id="menu-panel" class="menu-panel" hidden>
            <button type="button" class="menu-item" data-page="home">Home</button>
            <button type="button" class="menu-item" data-page="howto">How to use</button>
            <button type="button" class="menu-item" data-page="faq">FAQ</button>
            <button type="button" class="menu-item" data-page="status">Status</button>
            <button type="button" class="menu-item" data-page="links">Useful links</button>
            <button type="button" class="menu-item" data-page="contact">Contact</button>
          </nav>
        </div>

        <button type="button" id="red-btn" class="red-toggle" aria-pressed="false"
                title="Night-vision mode — recolours the site red so it doesn't spoil your dark adaptation">
          <span class="red-dot" aria-hidden="true"></span>Night vision
        </button>
      </div>

      <div class="header-filters">
        <div class="segmented" role="group" aria-label="Observing type">
          <button type="button" class="mode-btn is-active" data-mode="deepsky">Deep sky</button>
          <button type="button" class="mode-btn" data-mode="planetary">Planets & Moon</button>
        </div>
        <div class="places">
          <div id="saved-list" class="saved-list"></div>
          <button type="button" id="save-btn" class="btn-ghost" hidden>+ Save place</button>
          <button type="button" id="compare-btn" class="btn-ghost" hidden>Compare</button>
        </div>
      </div>

      <div id="save-form" class="save-form" hidden>
        <input id="save-name" type="text" placeholder="Place name (e.g. Covão)" />
        <button type="button" id="save-confirm" class="btn-primary">Save</button>
        <button type="button" id="save-cancel" class="btn-ghost">Cancel</button>
      </div>
    </header>

    <p id="status" class="status" hidden></p>

    <section id="result" class="result" hidden>
      <div class="place-line">
        <span id="place-name" class="place-name"></span>
        <span id="place-sky" class="place-sky"></span>
      </div>

      <nav id="strip" class="strip" aria-label="Upcoming nights"></nav>

      <div id="detail" class="detail"></div>
    </section>

    <footer class="site-footer">
      <nav class="footer-links" aria-label="Legal and support links">
        <button type="button" class="link-btn" data-page="howto">How to use</button>
        <button type="button" class="link-btn" data-page="faq">FAQ</button>
        <button type="button" class="link-btn" data-page="cookies">Cookie policy</button>
        <button type="button" class="link-btn" data-page="privacy">Privacy policy</button>
        <button type="button" class="link-btn" data-page="terms">Terms & conditions</button>
        <button type="button" class="link-btn" data-page="ack">Acknowledgements</button>
        <button type="button" class="link-btn" data-page="bugs">Report a bug</button>
        <button type="button" class="link-btn" data-page="contact">Contact</button>
      </nav>
      <p class="footer-legal">© 2026 Astrowe · José Bento · All rights reserved</p>
    </footer>
  </div>

  <!-- Espaços de anúncio nos vãos laterais (DESATIVADOS por agora — os
       placeholders ficavam estranhos). O CSS (.ad-rail/.ad-slot) fica no sítio.
       PARA REATIVAR: descomenta o bloco abaixo (remove as linhas <!__ e __>).
       Só aparecem em ecrãs largos (>=1600px). Para ads reais, troca o
       <span class="ad-ph"> pelo teu bloco (ex.: o <ins> do AdSense) e carrega o
       script do fornecedor ao fim do <body>. Formato: 160x600. -->
  <!--
  <aside class="ad-rail ad-left" aria-hidden="true">
    <div class="ad-slot"><span class="ad-ph">Publicidade</span></div>
  </aside>
  <aside class="ad-rail ad-right" aria-hidden="true">
    <div class="ad-slot"><span class="ad-ph">Publicidade</span></div>
  </aside>
  -->

  <div id="map-modal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <strong>Pick a location on the map</strong>
        <button type="button" id="map-close" class="btn-icon" title="Close">✕</button>
      </div>
      <div id="map"></div>
      <div class="modal-foot">
        <span id="map-coords">Click the map to pick a point.</span>
        <button type="button" id="map-confirm" class="btn-primary" disabled>Use this location</button>
      </div>
    </div>
  </div>

  <div id="compare-modal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <strong>Your places, night by night</strong>
        <button type="button" id="compare-close" class="btn-icon" title="Close">✕</button>
      </div>
      <div id="compare-body" class="compare-body"></div>
    </div>
  </div>

  <!-- Páginas de conteúdo (FAQ, Como usar, legais…): abrem aqui por cima. O
       conteúdo vive em PAGES, no app.js — é aí que se preenche cada uma. -->
  <div id="page-modal" class="modal" hidden>
    <div class="modal-box page-box">
      <div class="modal-head">
        <strong id="page-title"></strong>
        <button type="button" id="page-close" class="btn-icon" title="Close">✕</button>
      </div>
      <div id="page-body" class="page-body"></div>
    </div>
  </div>

  <!-- Banner de consentimento de cookies. Aparece na 1ª visita; a escolha fica
       guardada. É aqui que, no futuro, se decide carregar (ou não) anúncios. -->
  <div id="cookie-banner" class="cookie-banner" hidden>
    <p class="cookie-text">
      We use local storage to make the site work and, in future, advertising cookies. <button type="button" class="link-btn" data-page="cookies">Learn more</button>
    </p>
    <div class="cookie-actions">
      <button type="button" id="cookie-reject" class="btn-ghost">Essential only</button>
      <button type="button" id="cookie-accept" class="btn-primary">Accept</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/app.js?v=16"></script>
</body>
</html>
